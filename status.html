<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blockchain Tracker · Status</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#e8edf8}
    body{max-width:900px;margin:0 auto;padding:28px 18px}h1{font-size:25px;margin:0 0 6px}.muted{color:#9aa8c2;font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:22px 0}
    .card{background:#151e33;border:1px solid #293653;border-radius:14px;padding:16px;overflow-wrap:anywhere}.state{font-size:20px;font-weight:700;margin-top:8px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#c5d0e5}.ok{color:#55d69e}.bad{color:#ff8585}
  </style>
</head>
<body>
  <h1>Blockchain Tracker Status</h1><div class="muted" id="updated">Loading status…</div>
  <section class="grid" id="summary"></section>
  <h2>Providers</h2><section class="grid" id="providers"></section>
  <h2>Cron jobs</h2><section class="grid" id="cron"></section>
  <script>
    const el=id=>document.getElementById(id), esc=v=>String(v??"unknown").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const card=(title,value,detail="")=>`<article class="card"><div class="muted">${esc(title)}</div><div class="state">${esc(value)}</div><div class="muted">${esc(detail)}</div></article>`;
    async function load(){try{const r=await fetch('/api/status',{cache:'no-store'}),d=await r.json();el('updated').textContent='Updated '+new Date(d.now||Date.now()).toLocaleString();el('summary').innerHTML=card('API / database',d.database?.ok?'Operational':'Database issue',d.database?.error||'DB ping')+card('Errors · last 24h',d.errors24h??'Unavailable')+card('Cron jobs',Array.isArray(d.cron)?d.cron.length:'Unavailable');el('providers').innerHTML=(d.providers||[]).map(p=>card(p.provider,p.last_fail&&!p.last_ok?'Check provider':p.last_ok?'Reported healthy':'Unknown',`OK ${p.ok_count} · failures ${p.fail_count} · ${p.last_error||''}`)).join('')||card('Providers','No provider telemetry yet');el('cron').innerHTML=(d.cron||[]).map(c=>card(c.job,c.last_status<400?'Last run OK':'Last run needs attention',`Last: ${c.last_start||'—'} · runs ${c.runs} · failures ${c.failures}`)).join('')||card('Cron','No runs recorded yet');}catch(e){el('updated').textContent='Unable to load status';el('summary').innerHTML=card('Status API','Unavailable',e.message)}}load();
  </script>
</body></html>
