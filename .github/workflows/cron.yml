name: alert-workers
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: alert-workers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing repo secret APP_URL or CRON_SECRET"; exit 1
          fi
      - name: Price alerts
        run: |
          curl -fsS --retry 2 --retry-delay 3 -m 90 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/alerts"
      - name: On-chain alerts (wallet / whale / contract)
        if: always()
        run: |
          curl -fsS --retry 2 --retry-delay 3 -m 90 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/onchain"
