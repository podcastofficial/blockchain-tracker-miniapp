<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Launchpad · Blockchain Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<style>
:root{--ink:#1e2a52;--mut:#6b7691;--line:#d5dcf0;--bg:#f3f5fc;--grad:linear-gradient(135deg,#2457ff,#7c3aed);--up:#10b981;--dn:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
#bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e5e9f5;position:sticky;top:0;background:#fff;z-index:5}
#bar b{font-size:15px;flex:1}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink);font-family:inherit}
.main{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;color:#fff;background:var(--grad);cursor:pointer;font-family:inherit}
.main:disabled{opacity:.5}.main.buy{background:var(--up)}.main.sell{background:var(--dn)}
.wrap{padding:14px;max-width:560px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.card{display:flex;gap:12px;background:var(--bg);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.card img,.ph{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#dfe5f7;flex:none}
.card .t{font-weight:800;font-size:14px}.card .s{font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:6px;background:#dfe5f7;border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--grad)}
.fld{margin-bottom:10px}.fld label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px;font-size:14px;font-family:inherit;color:var(--ink)}
.chips{display:flex;gap:6px;margin:8px 0}.chips button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:11px;border:0;border-radius:11px;font-weight:800;cursor:pointer;background:var(--bg);color:var(--ink);font-family:inherit}
.seg .buy.on{background:var(--up);color:#fff}.seg .sell.on{background:var(--dn);color:#fff}
#status{font-size:12px;line-height:1.7;margin:12px 2px;color:#3a4566;overflow-wrap:anywhere}#status a{color:#2457ff;font-weight:700}
.note{font-size:11px;color:var(--mut);text-align:center;line-height:1.6;padding:10px 10px 28px}
.box{background:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px}.box small{display:block;color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:6px}
.box input{width:100%;border:0;background:transparent;font-size:24px;font-weight:800;color:var(--ink);outline:none;font-family:inherit}
iframe{width:100%;height:340px;border:0;border-radius:14px;margin-bottom:10px;background:var(--bg)}
.links a{font-size:12px;font-weight:700;color:#2457ff;margin-right:12px}
.chips.src{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}.chips.src button{flex:none;white-space:nowrap;padding:7px 11px}
.chips button.on{background:var(--grad);color:#fff;border-color:transparent}
.bdg{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:#e3e9ff;color:#2457ff;vertical-align:middle;margin-left:4px}
.up{color:var(--up);font-weight:700}.dn{color:var(--dn);font-weight:700}
.empty{padding:30px 10px;text-align:center;color:var(--mut);font-size:13px;line-height:1.7}
</style><meta name="theme-color" content="#05060d"><link rel="icon" type="image/png" href="/assets/favicon-64.png"><link rel="apple-touch-icon" href="/assets/logo-192.png"><link rel="stylesheet" href="/assets/theme-sub.css"><script defer src="/assets/fx3d.js"></script></head>
<body>
<div id="bar"><button class="btn" id="back" type="button">← Back</button><img class="bar-logo" src="/assets/logo-96.png" alt="Multi Blockchain Tracker" width="30" height="30"><b>🚀 Launchpad</b><button class="btn" id="wbtn" type="button">Connect wallet</button></div>
<div class="wrap" id="app"></div>

<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const tg=window.Telegram&&Telegram.WebApp;
try{if(tg){tg.ready();tg.expand()}}catch{}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short=a=>a?a.slice(0,4)+"…"+a.slice(-4):"";
const api=async(p,o)=>{const r=await fetch(p,{credentials:"include",headers:{"Content-Type":"application/json"},...o});let j={};try{j=await r.json()}catch{}return{status:r.status,...j}};
let wallet=null,cfg={},view=qs.get("tab")==="create"?"create":"explore",src="all",cur=null,side="buy",img=null;

/* ---- login (Telegram) ---- */
async function login(){
  if(tg&&tg.initData){const r=await api("/api/auth/telegram",{method:"POST",body:JSON.stringify({initData:tg.initData})});if(r.ok)return true}
  const r=await api("/api/auth/me");if(r.ok)return true;
  return askCode();   // e.g. inside Phantom's browser: no Telegram data, so log in with a one-time bot code
}
function askCode(){return new Promise(ok=>{
  setStatus('<b>Login needed.</b> Open your Telegram bot, send <b>/login</b>, then type the code here:<br><input id="lc" maxlength="9" autocapitalize="characters" placeholder="ABCD-2345" style="margin:8px 6px 0 0;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;width:150px"><button class="btn" id="lcb" type="button">Login</button> <span id="lcm" style="color:var(--dn)"></span>');
  $("lcb").onclick=async()=>{$("lcm").textContent="";const r=await api("/api/auth/code",{method:"POST",body:JSON.stringify({code:$("lc").value})});
    if(r.ok){setStatus("Logged in ✔");ok(true)}else $("lcm").textContent="Wrong or expired code"}})}

/* ---- wallet (Phantom) ---- */
const provider=()=>window.phantom?.solana?.isPhantom?window.phantom.solana:(window.solana?.isPhantom?window.solana:null);
async function connect(){
  const p=provider();
  if(!p){
    const u="https://phantom.app/ul/browse/"+encodeURIComponent(location.href)+"?ref="+encodeURIComponent(location.origin);
    $("status")&&($("status").innerHTML='Phantom not found here. <a href="'+u+'" target="_blank">Open this page inside Phantom</a> (wallet connect does not work in Telegram\'s built-in browser).');
    if(tg)tg.openLink(u);else window.open(u,"_blank");return;
  }
  const r=await p.connect();wallet=r.publicKey.toString();$("wbtn").textContent=short(wallet);
  if(view==="token")loadBal();
}
$("wbtn").onclick=connect;
async function signSend(b64){
  const p=provider();if(!p||!wallet)throw new Error("Connect wallet first");
  const tx=solanaWeb3.Transaction.from(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)));
  const r=await p.signAndSendTransaction(tx);return r.signature;
}
const setStatus=h=>{const e=$("status");if(e)e.innerHTML=h};

/* ---- views ---- */
function shell(inner){$("app").innerHTML='<div class="tabs"><button data-v="explore" class="'+(view==="explore"?"on":"")+'">Explore</button><button data-v="create" class="'+(view==="create"?"on":"")+'">Create coin</button></div>'+inner;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;cur=null;render()})}

const SRC=[["all","🌐 All"],["pumpfun","💊 Pump.fun"],["pancakeswap","🥞 PancakeSwap"],["solana","◎ Solana"],["dexscreener","📊 DexScreener"],["coingecko","🦎 CoinGecko"],["new","🆕 Created here"],["graduating","🎓 Graduating"]];
const LBL={pumpfun:"Pump.fun",pancakeswap:"PancakeSwap",solana:"Solana",dexscreener:"DexScreener",coingecko:"CoinGecko"};
const money=n=>n==null?"—":n>=1e9?"$"+(n/1e9).toFixed(2)+"B":n>=1e6?"$"+(n/1e6).toFixed(2)+"M":n>=1e3?"$"+(n/1e3).toFixed(1)+"K":"$"+n.toFixed(0);
const age=t=>{if(!t)return"";const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"just now":m<60?m+"m ago":m<1440?Math.floor(m/60)+"h ago":Math.floor(m/1440)+"d ago"};
function extCard(t){
  const ch=t.change24,chg=ch==null?"":' · <span class="'+(ch>=0?"up":"dn")+'">'+(ch>=0?"+":"")+ch.toFixed(1)+'%</span>';
  const meta=[t.marketCap!=null?"MC "+money(t.marketCap):"",t.liquidity!=null?"Liq "+money(t.liquidity):"",t.volume24!=null?"Vol "+money(t.volume24):""].filter(Boolean).join(" · ");
  return '<div class="card" data-u="'+esc(t.url||"")+'">'+(t.image?'<img src="'+esc(t.image)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<div class="ph"></div>')+
    '<div style="flex:1;min-width:0"><div class="t">'+esc(t.name||"?")+' <span style="color:var(--mut);font-weight:600">$'+esc(t.symbol)+'</span><span class="bdg">'+esc(LBL[t.src]||t.src)+'</span></div>'+
    '<div class="s" style="-webkit-line-clamp:1">'+esc(meta||t.chain)+'</div>'+
    '<div style="font-size:11px;color:var(--mut);margin-top:4px">'+esc(t.chain)+(t.created?" · "+age(t.created):"")+chg+'</div></div></div>';
}
function openExt(u){if(!/^https:\/\//i.test(u))return;try{tg&&tg.openLink?tg.openLink(u):window.open(u,"_blank","noopener")}catch{window.open(u,"_blank","noopener")}}
async function loadList(){
  const box=$("list");if(!box||view!=="explore")return;
  const mine=src==="new"||src==="graduating";
  const r=await api(mine?"/api/launch/"+"list?sort="+src:"/api/launch/feed?source="+src);
  if(!$("list")||view!=="explore")return;
  if(!r.ok){box.innerHTML='<div class="empty">Could not load coins right now.<br>Tap the source again to retry.</div>';return}
  if(mine){
    box.innerHTML=!r.items.length?'<div class="empty">No coins created here yet.<br>Be the first: tap <b>Create coin</b>.</div>':
      r.items.map(t=>'<div class="card" data-m="'+t.mint+'"><img src="'+t.image+'" alt=""><div style="flex:1;min-width:0"><div class="t">'+esc(t.name)+' <span style="color:var(--mut);font-weight:600">$'+esc(t.symbol)+'</span></div><div class="s">'+esc(t.description||"")+'</div><div class="bar"><i style="width:'+Math.round((t.progress||0)*100)+'%"></i></div><div style="font-size:11px;color:var(--mut);margin-top:4px">'+(t.progress==null?"—":Math.round(t.progress*100)+"% to graduation")+' · by '+short(t.creator)+'</div></div></div>').join("");
  }else{
    const warn=r.failed&&r.failed.length?'<div class="note" style="padding:0 0 8px">Some sources are slow right now: '+r.failed.map(x=>LBL[x]||x).join(", ")+'</div>':"";
    box.innerHTML=warn+(r.items.length?r.items.map(extCard).join(""):'<div class="empty">No new coins found for this source.</div>');
  }
  box.querySelectorAll(".card").forEach(c=>c.onclick=()=>c.dataset.m?openToken(c.dataset.m):openExt(c.dataset.u));
}
function renderExplore(){
  shell('<div class="chips src">'+SRC.map(([k,l])=>'<button data-s="'+k+'" class="'+(src===k?"on":"")+'">'+l+'</button>').join("")+'</div><div id="list"><div class="empty">Loading…</div></div><p class="note">Coins from outside sources are shown for discovery only: tap a coin to open it on its own site. New coins are extremely risky, so always check liquidity and the contract before you buy.</p>');
  document.querySelectorAll(".chips.src button").forEach(b=>b.onclick=()=>{src=b.dataset.s;renderExplore()});
  loadList();
}
setInterval(()=>{if(view==="explore")loadList()},45000);

function renderCreate(){
  if(!cfg.enabled)return shell('<div class="empty">Coin creation is not configured yet.<br>Admin: set <b>DBC_CONFIG_KEY</b> and redeploy.</div>');
  shell('<div class="fld"><label>Logo (square image)</label><input id="f_img" type="file" accept="image/*"><img id="prev" style="display:none;width:80px;height:80px;border-radius:14px;margin-top:8px;object-fit:cover"></div>'+
  '<div class="fld"><label>Name</label><input id="f_name" maxlength="32" placeholder="My Coin"></div>'+
  '<div class="fld"><label>Ticker</label><input id="f_sym" maxlength="10" placeholder="MYCOIN" style="text-transform:uppercase"></div>'+
  '<div class="fld"><label>Description</label><textarea id="f_desc" rows="3" maxlength="500" placeholder="What is this coin about?"></textarea></div>'+
  '<div class="fld"><label>X / Twitter (optional)</label><input id="f_tw" placeholder="https://x.com/..."></div>'+
  '<div class="fld"><label>Telegram (optional)</label><input id="f_tgl" placeholder="https://t.me/..."></div>'+
  '<div class="fld"><label>Website (optional)</label><input id="f_web" placeholder="https://..."></div>'+
  '<div class="fld"><label>First buy in SOL (optional, done right after launch)</label><input id="f_buy" type="number" min="0" step="any" placeholder="0"></div>'+
  '<button class="main" id="go">Create coin</button><div id="status"></div>'+
  '<p class="note">Creating a coin costs a small amount of SOL in network fees. You sign inside your own wallet; this app never holds your keys. Launching tokens may be regulated where you live — you are responsible for what you launch.</p>');
  $("f_img").onchange=async e=>{const f=e.target.files[0];if(!f)return;img=await resize(f);$("prev").src=img;$("prev").style.display="block"};
  $("go").onclick=create;
}
function resize(file){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,256,256);ok(c.toDataURL("image/jpeg",.85))};i.onerror=no;i.src=URL.createObjectURL(file)})}

async function create(){
  const g=id=>$(id).value.trim();
  if(!img)return setStatus("Please add a logo.");if(g("f_name").length<2||g("f_sym").length<2)return setStatus("Enter a name and ticker.");
  $("go").disabled=true;
  try{
    if(!wallet)await connect();if(!wallet)throw new Error("Connect wallet first");
    if(!(await login()))throw new Error("Login required.");
    setStatus("Preparing transaction…");
    const p=await api("/api/launch/prepare",{method:"POST",body:JSON.stringify({wallet,image:img,name:g("f_name"),symbol:g("f_sym"),description:g("f_desc"),twitter:g("f_tw"),telegram:g("f_tgl"),website:g("f_web"),buySol:g("f_buy")||0})});
    if(!p.ok)throw new Error(p.error||"PREPARE_FAILED");
    setStatus("Approve the transaction in your wallet…");
    const sig=await signSend(p.tx);
    setStatus("Sent. Waiting for confirmation…");
    for(let i=0;i<40;i++){const c=await api("/api/launch/confirm",{method:"POST",body:JSON.stringify({id:p.id,signature:sig})});
      if(c.ok&&c.status==="live"){const first=Number(g("f_buy")||0);await openToken(p.mint);if(first>0){$("amt").value=String(first);quote();setStatus("Your coin is live 🎉 Tap <b>Buy</b> to make your first purchase.")}return}if(!c.ok)throw new Error(c.error);await new Promise(r=>setTimeout(r,2500))}
    throw new Error("Confirmation timed out. Check your wallet; the coin appears once the transaction lands.");
  }catch(e){setStatus('<span style="color:var(--dn)">'+esc(e.message||e)+'</span>');$("go").disabled=false}
}

async function openToken(mint){
  view="token";const r=await api("/api/launch/token?mint="+encodeURIComponent(mint));
  if(!r.ok){view="explore";return render()}
  cur=r.token;const t=cur;
  $("app").innerHTML='<button class="btn" id="tb" style="margin-bottom:10px">← All coins</button>'+
  '<div class="card" style="cursor:default"><img src="'+t.image+'"><div><div class="t">'+esc(t.name)+' <span style="color:var(--mut);font-weight:600">$'+esc(t.symbol)+'</span></div><div class="s">'+esc(t.description||"")+'</div></div></div>'+
  '<div class="bar" style="margin:0 0 4px"><i style="width:'+Math.round((t.progress||0)*100)+'%"></i></div><div style="font-size:12px;color:var(--mut);margin-bottom:10px">'+(t.progress==null?"—":Math.round(t.progress*100)+"% to graduation")+'</div>'+
  '<iframe src="https://dexscreener.com/solana/'+encodeURIComponent(t.pool)+'?embed=1&theme=light&trades=0&info=0" loading="lazy"></iframe>'+
  '<div class="links">'+(t.twitter?'<a href="'+esc(t.twitter)+'" target="_blank" rel="noopener">X</a>':'')+(t.telegram?'<a href="'+esc(t.telegram)+'" target="_blank" rel="noopener">Telegram</a>':'')+(t.website?'<a href="'+esc(t.website)+'" target="_blank" rel="noopener">Website</a>':'')+'<a href="https://solscan.io/token/'+t.mint+'" target="_blank" rel="noopener">Solscan</a></div>'+
  '<div style="height:12px"></div><div class="seg"><button class="buy on" data-sd="buy">Buy</button><button class="sell" data-sd="sell">Sell</button></div>'+
  '<div class="box"><small id="amtLbl">Amount in SOL</small><input id="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0.0"><div class="chips" id="quick"></div></div>'+
  '<div id="qt" style="font-size:12px;color:#3a4566;margin:0 2px 10px">Enter an amount.</div><div id="bal" style="font-size:12px;color:var(--mut);margin:0 2px 10px"></div>'+
  '<button class="main buy" id="go">Buy</button><div id="status"></div><p class="note">Price comes from the on-chain bonding curve. Memecoins are extremely risky: most go to zero. Only use money you can afford to lose.</p>';
  $("tb").onclick=()=>{view="explore";cur=null;render()};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setSide(b.dataset.sd));
  $("amt").oninput=quote;$("go").onclick=trade;setSide("buy");if(wallet)loadBal();
}
let bal={sol:0,token:0};
async function loadBal(){if(!wallet||!cur)return;const r=await api("/api/launch/balance?wallet="+wallet+"&mint="+cur.mint);if(r.ok){bal=r;$("bal").textContent="Balance: "+r.sol.toFixed(4)+" SOL · "+r.token+" $"+cur.symbol}}
function setSide(s){side=s;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.sd===s));
  $("go").className="main "+s;$("go").textContent=(s==="buy"?"Buy $":"Sell $")+cur.symbol;$("amtLbl").textContent=s==="buy"?"Amount in SOL":"Amount in $"+cur.symbol;
  $("quick").innerHTML=(s==="buy"?[0.1,0.5,1,5].map(v=>'<button data-v="'+v+'">'+v+' SOL</button>'):[25,50,100].map(v=>'<button data-p="'+v+'">'+v+'%</button>')).join("");
  document.querySelectorAll("#quick button").forEach(b=>b.onclick=()=>{$("amt").value=b.dataset.v||String(Math.floor(bal.token*Number(b.dataset.p)/100*1e6)/1e6);quote()});$("amt").value="";$("qt").textContent="Enter an amount."}
let qT;async function quote(){clearTimeout(qT);const a=$("amt").value;if(!(Number(a)>0)){$("qt").textContent="Enter an amount.";return}
  qT=setTimeout(async()=>{const r=await api("/api/launch/quote?mint="+cur.mint+"&side="+side+"&amount="+encodeURIComponent(a));
    $("qt").innerHTML=r.ok?"You receive about <b>"+(Number(r.amountOut)/10**r.outDecimals).toLocaleString(undefined,{maximumFractionDigits:6})+" "+(side==="buy"?"$"+esc(cur.symbol):"SOL")+"</b>":'<span style="color:var(--dn)">'+esc(r.error||"Quote failed")+"</span>"},350)}
async function trade(){
  const a=$("amt").value;if(!(Number(a)>0))return;$("go").disabled=true;
  try{
    if(!wallet)await connect();if(!wallet)throw new Error("Connect wallet first");
    if(!(await login()))throw new Error("Login required.");
    const s=await api("/api/launch/swap",{method:"POST",body:JSON.stringify({mint:cur.mint,wallet,side,amount:a,slippageBps:300})});
    if(!s.ok)throw new Error(s.error||"SWAP_FAILED");
    setStatus("Approve in your wallet…");const sig=await signSend(s.tx);
    setStatus('Sent ✔ <a href="https://solscan.io/tx/'+sig+'" target="_blank" rel="noopener">View transaction</a>');
    setTimeout(loadBal,5000);
  }catch(e){setStatus('<span style="color:var(--dn)">'+esc(e.message||e)+"</span>")}
  $("go").disabled=false;
}

function render(){view==="create"?renderCreate():view==="token"&&cur?openToken(cur.mint):renderExplore()}
$("back").onclick=()=>{if(view==="token"){view="explore";cur=null;render()}else if(history.length>1)history.back();else location.href="/"};
(async()=>{cfg=await api("/api/launch/config");
  if(qs.get("mint")&&cfg.enabled)openToken(qs.get("mint"));else render();
  const p=provider();if(p&&p.isConnected&&p.publicKey){wallet=p.publicKey.toString();$("wbtn").textContent=short(wallet)}})();
</script>
</body></html>
